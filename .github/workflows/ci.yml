name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check presets (@mooscript/presets)
        run: pnpm --filter @mooscript/presets typecheck

      - name: Type check studio (@mooscript/studio)
        run: pnpm --filter @mooscript/studio exec tsc -b

      - name: Lint check studio (ESLint)
        run: pnpm --filter @mooscript/studio lint

      # The golden-frame suite runs in Vitest browser mode on Playwright's Chromium.
      - name: Install Playwright Chromium
        run: pnpm --filter @mooscript/studio exec playwright install --with-deps chromium

      - name: Unit, integration & golden-frame tests (@mooscript/studio)
        run: pnpm --filter @mooscript/studio test

      - name: Production build (@mooscript/studio)
        run: pnpm --filter @mooscript/studio build

      - name: Check & build landing page (@mooscript/web)
        run: pnpm --filter @mooscript/web check && pnpm --filter @mooscript/web build
